<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="PDF Studio"><title>PDF Studio</title><style>.op-orbit{animation:op-spin 16s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes op-spin{to{transform:rotate(360deg)}}.op-spark{animation:op-tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes op-tw{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){.op-orbit,.op-spark{animation:none}}</style><defs><linearGradient id="op" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#7A63FF"/><stop offset="0.52" stop-color="#45D8E0"/><stop offset="1" stop-color="#FF4FA8"/></linearGradient><linearGradient id="oo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B46BFF"/><stop offset="1" stop-color="#45E3D4"/></linearGradient><linearGradient id="os" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFD9EC"/></linearGradient></defs><g transform="rotate(-16 64 64)"><g class="op-orbit"><ellipse cx="64" cy="64" rx="50" ry="19" fill="none" stroke="url(#oo)" stroke-width="4.5"/></g></g><path d="M44 34 Q44 26 52 26 H66 Q86 26 86 47 Q86 68 66 68 H58 V94 Q58 102 50 102 Q44 102 44 94 Z M58 40 V54 H64 Q72 54 72 47 Q72 40 64 40 Z" fill="url(#op)" fill-rule="evenodd"/><path class="op-spark" d="M101 38 C102.2 44.8 105.2 47.8 112 49 C105.2 50.2 102.2 53.2 101 60 C99.8 53.2 96.8 50.2 90 49 C96.8 47.8 99.8 44.8 101 38 Z" fill="url(#os)"/></svg>
