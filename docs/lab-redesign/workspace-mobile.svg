<svg xmlns="http://www.w3.org/2000/svg" width="430" height="800" viewBox="0 0 430 800">
<style>text{font-family:Arial,sans-serif;fill:#172033}.muted{fill:#526175}.white{fill:white}.note{font-size:14px;fill:#6341e8}</style>
<rect x="0" y="0" width="430" height="800" rx="0" fill="#f4f5f8" stroke="#dce1e8"/>
<text x="24" y="32" font-size="14" class="muted">REFERENCE CONCEPT • not a browser screenshot</text>
<rect x="16" y="50" width="398" height="58" rx="12" fill="#202838" stroke="#dce1e8"/>
<text x="32" y="86" font-size="20" class="white">Crop image</text>
<rect x="24" y="128" width="382" height="440" rx="12" fill="#e8ecf1" stroke="#dce1e8"/>
<rect x="70" y="164" width="292" height="295" rx="12" fill="#e3eddc" stroke="#dce1e8"/>
<text x="88" y="220" font-size="24" class="">Your image</text>
<rect x="95" y="240" width="237" height="130" rx="2" fill="none" stroke="#6341e8"/>
<text x="40" y="152" font-size="14" class="">Original   Select area   Preview</text>
<rect x="44" y="492" width="342" height="48" rx="12" fill="#fff" stroke="#dce1e8"/>
<text x="60" y="522" font-size="16" class="">−     Fit     1:1     +</text>
<text x="40" y="560" font-size="14" class="muted">300 × 400 px · Preview</text>
<rect x="24" y="590" width="90" height="62" rx="12" fill="#fff" stroke="#dce1e8"/>
<text x="33" y="627" font-size="16" class="">Settings</text>
<rect x="126" y="590" width="280" height="62" rx="12" fill="#6341e8" stroke="#dce1e8"/>
<text x="144" y="627" font-size="16" class="white">Create crop</text>
<text x="24" y="688" font-size="14" class="note">1  Image gets priority; view tools stay inside.</text>
<text x="24" y="715" font-size="14" class="note">2  Settings opens a labeled sheet.</text>
<text x="24" y="742" font-size="14" class="note">3  Action occupies its own row, not the image.</text>
<text x="24" y="769" font-size="14" class="note">4  Numeric crop controls remain available.</text>
</svg>