name: PDF Workflows interface
on:
  pull_request:
    paths:
      - 'components/workflow-builder.*'
      - 'components/ocr-studio.css'
      - 'app/page.tsx'
      - 'checks/verify-workflow-interface.mjs'
      - '.github/workflows/workflow-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci
      - run: npx eslint components/workflow-builder.tsx
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-react-workflows.mjs && node checks/verify-workflow-interface.mjs
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:public
