name: Repository quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check portable dependency sources
        run: node checks/verify-portable-lockfile.mjs
      - name: Match the Cloudflare package manager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - id: install
        run: npm ci
      - name: Lint with zero warnings
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: Dependency compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-dependency-compatibility.mjs
      - name: No critical or high dependency advisories
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Prepare independent PDF and GIF inspection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install Pillow
      - name: Reproducible guide examples and overlap inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run verify:guide-examples
      - name: Text editing regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-online-text.mjs && node checks/verify-horizontal-flow.mjs
      - name: Compression and image size regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run verify:compression && node checks/verify-image-size.mjs
      - name: Image-only Studio Lab outputs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-image-lab.mjs
      - name: Image Studio articles and sitemap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-image-guides.mjs
      - name: Drawing and Lab regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-daily-mood-canvas.mjs && node checks/verify-lab-visual.mjs
      - name: Watermark and signature outputs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-watermark.mjs && node checks/verify-signatures.mjs
      - name: Upload and PDF workflow regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-react-workflows.mjs && node checks/verify-workflow-interface.mjs
      - name: Reader navigation and page destination preservation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-reader-navigation.mjs && node checks/verify-reader-password.mjs && node checks/verify-reader-queue.mjs
      - name: Fillable form page assembly and appearance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-form-appearance.mjs
      - name: PDF to Word output regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-word-conversion.mjs && node checks/verify-word-source.mjs && node checks/verify-word-layout.mjs
      - name: Desktop audit output regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-desktop-audit.mjs && node checks/verify-export-filenames.mjs && node checks/verify-accent-themes.mjs
      - name: Recovery, routes, messages and Unicode text
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-audit-recovery.mjs && node checks/verify-tool-navigation.mjs && node checks/verify-tool-expectations.mjs && node checks/verify-settings-validation.mjs && node checks/verify-text-document.mjs
      - name: Lab studio navigation and search
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-lab-navigation.mjs
      - name: Canonical sitemap regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-sitemap-canonical.mjs
      - name: Site maintenance regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-site-maintenance.mjs && node checks/verify-responsive-layout.mjs && node checks/verify-device-layout.mjs
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:public




      - name: Generated sitemap coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node checks/verify-review-sitemap.mjs && node checks/verify-image-guides.mjs && npm run verify:seo && npm run verify:seo:rendered




