name: Play Studio mobile browser QA
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Accessible site base URL (production or public preview)"
        required: true
        default: "https://pdf-studio.in"
permissions:
  contents: read
jobs:
  mobile-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser automation
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Audit all 100 active game routes in mobile Chromium
        id: catalog
        continue-on-error: true
        run: python checks/mobile-catalog-qa.py --base "${{ github.event.inputs.target_url }}" --output play-studio-mobile-qa --concurrency 3
      - name: Play through priority controls at five viewport sizes
        id: priority
        if: always()
        continue-on-error: true
        run: python checks/mobile-play-studio.py --base "${{ github.event.inputs.target_url }}" --output play-studio-mobile-qa
      - name: Fail when either game QA suite fails
        if: always()
        run: |
          test "${{ steps.catalog.outcome }}" = "success"
          test "${{ steps.priority.outcome }}" = "success"
      - name: Save full-page screenshots and JSON findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-studio-mobile-qa
          path: play-studio-mobile-qa/
          if-no-files-found: warn
          retention-days: 14
